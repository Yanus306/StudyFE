<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>지혜로운 소비</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="common.css">
</head>
<body>
    <div id="app">
        <!-- 1. 상단 레이아웃이 들어갈 자리 -->
        <div id="header-container"></div>
        
     <!-- 2. 메인 콘텐츠 영역 -->
       <main class="main-content">
            <!-- 위젯 바깥쪽 타이틀 -->
            <h2 class="widget-title">나의 소비 현황</h2>

            <!-- 첫 번째 위젯 -->
            <div class="widget-card" style="height: 240px;">
                <div class="widget-content" style="display: flex; flex-direction: column; justify-content: space-between; height: 100%;">
                    
                    <!-- 상단: 원 그래프와 예산 정보 -->
                    <div class="chart-container">
                        <div class="donut-chart">
                            <div class="chart-text-box">
                                <span class="chart-percent">70%</span>
                                <span class="chart-sub-label">이번달 사용 금액</span>
                            </div>
                        </div>
                       <div class="chart-info">
                            <!-- 총 예산 글자 옆에 톱니바퀴 추가 -->
                            <div class="info-header" style="display: flex; align-items: center; gap: 4px;">
                                <p class="info-label">총 예산</p>
                                <span class="settings-gear" title="예산 설정">⚙️</span>
                            </div>
                            <p class="info-value">1,000,000원</p>
                            
                            <p class="info-label" style="margin-top: 8px;">잔여 예산</p>
                            <p class="info-value" style="color: #3182ce;">300,000원</p>
                        </div>
                    </div>

                    <!-- 하단: 간단한 소비 점수 영역 -->
                    <div class="widget-score-row">
                        <span class="score-label">이번 달 소비 점수</span>
                        <span class="score-value">85점 🥈</span>
                    </div>
                </div>
            </div>
            <!-- 구매 프로세스 섹션 추가 -->
        <h2 class="widget-title" style="margin-top: 20px;">구매 프로세스</h2>
        
<div class="process-container">
            <!-- 1. 구매 예정 -->
            <div class="process-btn" style="flex-direction: column; align-items: flex-start; justify-content: center; padding-left: 14px; gap: 4px;">
                <span style="font-size: 18px;">🛒</span>
                <span style="font-size: 13px; font-weight: bold;">장바구니</span>
                <span style="font-size: 10px; color: #718096; font-weight: normal;">(5개)</span>
            </div>
            
            <!-- 2. 구매 중 -->
            <div class="process-btn" style="flex-direction: column; align-items: flex-start; justify-content: center; padding-left: 14px; gap: 4px;">
                <span style="font-size: 18px;">⏳</span>
                <span style="font-size: 13px; font-weight: bold;">유예 기간</span>
                <span style="font-size: 10px; color: #718096; font-weight: normal;">(1개)</span>
            </div>
            
            <!-- 3. 구매 완료 (구매 승인, 체크 이모지, 15개 적용) -->
            <div class="process-btn" style="flex-direction: column; align-items: flex-start; justify-content: center; padding-left: 14px; gap: 4px;">
                <span style="font-size: 18px;">✅</span>
                <span style="font-size: 13px; font-weight: bold;">구매 승인</span>
                <span style="font-size: 10px; color: #718096; font-weight: normal;">(15개)</span>
            </div>
        </div>
        <h2 class="widget-title" style="margin-top: 20px;">AI 소비 피드백</h2>
        
        <div class="widget-card ai-feedback-card">
            <div class="ai-feedback-header">
                <span class="ai-icon">✨</span>
                <span class="ai-title">이번 주 소비 요약 리포트</span>
            </div>
            <p class="ai-feedback-text">
                전반적인 예산 관리가 매우 훌륭해요! 특히 불필요한 지출이 줄어들어 <strong>'절약 모범생'</strong> 등급을 유지하고 있습니다. 남은 기간도 이 페이스를 유지해 보세요!
            </p>
        </div>
        </main>

        

        <!-- 3. 하단 레이아웃이 들어갈 자리 -->
        <div id="nav-container"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
